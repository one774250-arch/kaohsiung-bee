<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高雄小蜜蜂｜共用連結看板</title>
<script src="/config.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <svg class="brand-hex" viewBox="0 0 40 40" aria-hidden="true">
      <polygon points="20,2 36,11 36,29 20,38 4,29 4,11" />
    </svg>
    <div class="brand-text">
      <h1>高雄小蜜蜂</h1>
      <p>共用連結看板・大家一起蒐集、檢舉、分享</p>
    </div>
  </div>

  <div class="topbar-actions" id="normalActions">
    <button class="btn btn-ghost" id="btnAdd">
      <svg viewBox="0 0 20 20" class="icon"><path d="M10 4v12M4 10h12"/></svg>
      新增
    </button>
    <button class="btn btn-ghost" id="btnEnterEdit">
      <svg viewBox="0 0 20 20" class="icon"><path d="M4 16l1-4 9-9 3 3-9 9-4 1z"/></svg>
      修改
    </button>
    <button class="btn btn-ghost" id="btnEnterDelete">
      <svg viewBox="0 0 20 20" class="icon"><path d="M4 6h12M8 6V4h4v2M6 6l1 10h6l1-10"/></svg>
      刪除
    </button>
    <button class="btn btn-ghost" id="btnCommentSettings">
      <svg viewBox="0 0 20 20" class="icon"><path d="M3 4h14v9H7l-4 4V4z"/></svg>
      留言設定
    </button>
    <button class="btn btn-ghost" id="btnEnterShare">
      <svg viewBox="0 0 20 20" class="icon"><path d="M14 6a2 2 0 100-4 2 2 0 000 4zM6 12a2 2 0 100-4 2 2 0 000 4zM14 18a2 2 0 100-4 2 2 0 000 4zM7.6 10.6l4.8-2.6M7.6 9.4l4.8 2.6"/></svg>
      分享
    </button>
  </div>

  <div class="topbar-actions" id="shareActions" hidden>
    <span class="select-count" id="shareSelectCount">已選取 0 筆</span>
    <button class="btn btn-primary" id="btnConfirmShare">確認</button>
    <button class="btn btn-ghost" id="btnCancelShare">取消</button>
  </div>

  <div class="topbar-actions" id="editModeActions" hidden>
    <span class="select-count">請點選要修改的項目</span>
    <button class="btn btn-ghost" id="btnCancelEdit">取消</button>
  </div>

  <div class="topbar-actions" id="deleteActions" hidden>
    <span class="select-count" id="selectCount">已選取 0 筆</span>
    <button class="btn btn-danger" id="btnConfirmDelete">刪除選取項目</button>
    <button class="btn btn-ghost" id="btnCancelDelete">取消</button>
  </div>

  <!-- 留言設定：密碼通過後顯示的管理選單 -->
  <div class="topbar-actions" id="commentMenuActions" hidden>
    <button class="btn btn-ghost" id="btnCommentManage">編輯</button>
    <button class="btn btn-ghost" id="btnCommentSettingsClose">完成</button>
  </div>

  <!-- 留言設定：選取卡片模式 -->
  <div class="topbar-actions" id="commentSelectActions" hidden>
    <span class="select-count">請點選要設定留言的卡片</span>
    <button class="btn btn-ghost" id="btnCancelCommentSelect">取消</button>
  </div>

  <button class="btn btn-ghost" id="btnCollapseSection" hidden>← 收回</button>
</header>

<!-- 手機版三個大按鈕，點下去才會展開該區資料；電腦版不會顯示這個區塊 -->
<div class="mobile-section-buttons" id="mobileButtons">
  <button class="section-button section-button-friend" id="mobileBtnFriend">
    小帳加好友區
    <span class="today-badge" id="friendBadge" hidden>本日新增</span>
  </button>
  <button class="section-button section-button-report" id="mobileBtnReport">
    檢舉區
    <span class="today-badge" id="reportBadge" hidden>本日新增</span>
  </button>
  <button class="section-button section-button-share" id="mobileBtnShare">
    按讚分享區
    <span class="today-badge" id="shareBadge" hidden>本日新增</span>
  </button>
</div>

<main class="board">
  <section class="column column-report" aria-labelledby="reportHeading">
    <h2 id="reportHeading"><span class="dot dot-report"></span>檢舉區</h2>
    <div class="cardlist" id="reportList"></div>
    <p class="empty-hint" id="reportEmpty" hidden>目前還沒有人新增檢舉項目。</p>
  </section>

  <section class="column column-share" aria-labelledby="shareHeading">
    <h2 id="shareHeading"><span class="dot dot-share"></span>按讚分享區</h2>
    <div class="cardlist" id="shareList"></div>
    <p class="empty-hint" id="shareEmpty" hidden>目前還沒有人新增分享項目。</p>
  </section>

  <section class="column column-friend" aria-labelledby="friendHeading">
    <h2 id="friendHeading"><span class="dot dot-friend"></span>小帳加好友區</h2>
    <div class="cardlist" id="friendList"></div>
    <p class="empty-hint" id="friendEmpty" hidden>目前還沒有人新增小帳加好友項目。</p>
  </section>
</main>

<!-- 新增連結 Modal -->
<div class="modal-backdrop" id="addBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <h3 id="addTitle">新增連結</h3>
    <form id="addForm">
      <label class="checkbox-label">
        <input type="checkbox" name="is_priority" class="priority-checkbox">
        優先處理（勾選後卡片會標示為優先項目）
      </label>

      <label>
        日期（系統自動帶出，新增當下的日期）
        <input type="text" class="readonly-field" id="addDateDisplay" readonly>
      </label>

      <label>
        分類（必填）
        <select name="category" required>
          <option value="" disabled selected>請選擇分類</option>
          <option value="report">檢舉貼文</option>
          <option value="report_comment">檢舉留言</option>
          <option value="share">按讚分享貼文</option>
          <option value="share_comment">按讚留言</option>
          <option value="friend_add">小帳加好友</option>
        </select>
      </label>

      <label>
        社群類型（必填）
        <select name="platform" required>
          <option value="" disabled selected>請選擇社群類型</option>
          <option value="ig">IG</option>
          <option value="fb">FB</option>
          <option value="youtube">YouTube</option>
          <option value="threads">Threads</option>
          <option value="news">新聞網</option>
          <option value="other">其他</option>
        </select>
      </label>

      <label>
        網址（必填）
        <input type="url" name="url" id="urlInput" placeholder="貼上網址，例如 https://..." required>
        <span class="field-hint" id="titleFetchHint">貼上後將自動嘗試抓取標題</span>
      </label>

      <label>
        標題（自動抓取，若抓不到可自行輸入）
        <input type="text" name="title" id="titleInput" placeholder="尚未抓取到標題，可以手動輸入">
      </label>

      <label>
        新增者（選填）
        <input type="text" name="creator_name" id="creatorInput" list="creatorSuggestions" placeholder="不填則顯示為匿名，可從清單挑選常用名字" autocomplete="off">
        <datalist id="creatorSuggestions"></datalist>
      </label>

      <p class="form-error" id="addError" hidden></p>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelAdd">取消</button>
        <button type="submit" class="btn btn-primary" id="btnSubmitAdd">確認新增</button>
      </div>
    </form>
  </div>
</div>

<!-- 修改連結 Modal -->
<div class="modal-backdrop" id="editBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <h3 id="editTitle">修改連結</h3>
    <form id="editForm">
      <input type="hidden" name="id">

      <label class="checkbox-label">
        <input type="checkbox" name="is_priority" class="priority-checkbox" id="editPriorityCheckbox">
        優先處理（勾選後卡片會標示為優先項目）
      </label>

      <label>
        日期（原始新增日期，不可修改）
        <input type="text" class="readonly-field" id="editDateDisplay" readonly>
      </label>

      <label>
        分類（必填）
        <select name="category" required>
          <option value="report">檢舉貼文</option>
          <option value="report_comment">檢舉留言</option>
          <option value="share">按讚分享貼文</option>
          <option value="share_comment">按讚留言</option>
          <option value="friend_add">小帳加好友</option>
        </select>
      </label>

      <label>
        社群類型（必填）
        <select name="platform" required>
          <option value="ig">IG</option>
          <option value="fb">FB</option>
          <option value="youtube">YouTube</option>
          <option value="threads">Threads</option>
          <option value="news">新聞網</option>
          <option value="other">其他</option>
        </select>
      </label>

      <label>
        網址（必填）
        <input type="url" name="url" id="editUrlInput" required>
        <span class="field-hint" id="editTitleFetchHint">可重新貼上網址並自動嘗試抓取標題</span>
      </label>

      <label>
        標題（自動抓取，若抓不到可自行輸入）
        <input type="text" name="title" id="editTitleInput" placeholder="尚未抓取到標題，可以手動輸入">
      </label>

      <label>
        新增者（選填）
        <input type="text" name="creator_name" id="editCreatorInput" list="creatorSuggestions" placeholder="不填則顯示為匿名" autocomplete="off">
      </label>

      <p class="form-error" id="editError" hidden></p>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelEditForm">取消</button>
        <button type="submit" class="btn btn-primary" id="btnSubmitEdit">儲存修改</button>
      </div>
    </form>
  </div>
</div>

<!-- 刪除確認 Modal -->
<div class="modal-backdrop" id="confirmBackdrop" hidden>
  <div class="modal modal-small" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h3 id="confirmTitle">確定刪除？</h3>
    <p class="confirm-text" id="confirmText"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnCancelConfirm">取消</button>
      <button type="button" class="btn btn-danger" id="btnDoDelete">刪除</button>
    </div>
  </div>
</div>

<!-- 留言設定：密碼輸入 Modal -->
<div class="modal-backdrop" id="commentPasswordBackdrop" hidden>
  <div class="modal modal-small" role="dialog" aria-modal="true" aria-labelledby="commentPasswordTitle">
    <h3 id="commentPasswordTitle">留言設定</h3>
    <form id="commentPasswordForm">
      <label>
        請輸入密碼
        <input type="password" id="commentPasswordInput" autocomplete="off" required>
      </label>
      <p class="form-error" id="commentPasswordError" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btnCancelCommentPassword">取消</button>
        <button type="submit" class="btn btn-primary">確認</button>
      </div>
    </form>
  </div>
</div>

<!-- 留言範本管理 Modal（選好卡片後開啟） -->
<div class="modal-backdrop" id="templateManageBackdrop" hidden>
  <div class="modal modal-large" role="dialog" aria-modal="true" aria-labelledby="templateManageTitle">
    <h3 id="templateManageTitle">留言範本管理</h3>
    <p class="template-manage-sub" id="templateManageLinkTitle"></p>

    <div class="template-groups-row">
      <div class="template-group-list" id="templateGroupList"></div>
      <div class="template-group-add">
        <input type="text" id="newGroupNameInput" placeholder="新組別名稱">
        <button type="button" class="btn btn-ghost" id="btnAddGroup">＋ 新增組別</button>
      </div>
    </div>

    <div id="templateGroupDetail" hidden>
      <h4 class="template-section-title">貼上原文，自動分割新增範例</h4>
      <textarea id="rawTextInput" rows="4" placeholder="貼上一大段文字，會依換行自動拆成好幾則"></textarea>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button type="button" class="btn btn-ghost" id="btnSplitText">分割</button>
      </div>
      <div id="splitResultList" class="split-result-list"></div>
      <div class="modal-actions" style="justify-content:flex-start;" id="splitConfirmRow" hidden>
        <button type="button" class="btn btn-primary" id="btnConfirmAddSplit">確認新增到目前組別</button>
      </div>

      <h4 class="template-section-title">現有範例（可直接編輯／刪除）</h4>
      <div id="existingTemplateList" class="existing-template-list"></div>
      <p class="empty-hint" id="existingTemplateEmpty" hidden>這個組別還沒有任何範例。</p>
      <div class="modal-actions" style="justify-content:flex-start;">
        <button type="button" class="btn btn-primary" id="btnSaveTemplateEdits">儲存修改</button>
      </div>
    </div>

    <p class="form-error" id="templateManageError" hidden></p>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnCloseTemplateManage">關閉</button>
    </div>
  </div>
</div>

<!-- 留言範例：複製確認 Modal -->
<div class="modal-backdrop" id="copyConfirmBackdrop" hidden>
  <div class="modal modal-small" role="dialog" aria-modal="true" aria-labelledby="copyConfirmTitle">
    <h3 id="copyConfirmTitle">確認複製這句留言？</h3>
    <p class="confirm-text" id="copyConfirmText"></p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnCancelCopy">取消</button>
      <button type="button" class="btn btn-primary" id="btnConfirmCopy">確認</button>
    </div>
  </div>
</div>

<!-- 卡片上的「留言範例」彈窗 -->
<div class="modal-backdrop" id="exampleBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exampleTitle">
    <h3 id="exampleTitle">留言範例</h3>

    <label>
      組別
      <select id="exampleGroupSelect"></select>
    </label>

    <label>
      範例
      <div class="example-field-row">
        <div class="example-text" id="exampleText">（請選擇組別）</div>
        <button type="button" class="btn-icon" id="btnRerollExample" title="重選">🔀</button>
      </div>
    </label>

    <div class="modal-actions" style="justify-content:space-between;">
      <button type="button" class="btn btn-primary" id="btnCopyExample">複製</button>
      <button type="button" class="btn btn-ghost" id="btnGotoUrl">前往網址</button>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnCloseExample">關閉</button>
    </div>
  </div>
</div>

<!-- 分享：組合內容 Modal -->
<div class="modal-backdrop" id="shareComposeBackdrop" hidden>
  <div class="modal modal-large" role="dialog" aria-modal="true" aria-labelledby="shareComposeTitle">
    <h3 id="shareComposeTitle">分享組合</h3>

    <p class="template-manage-sub">已自動帶入選取卡片的網址（右側顯示對應標題），可自由編輯內容、上下調整順序</p>

    <div id="shareRowList" class="share-row-list"></div>

    <div class="modal-actions" style="justify-content:flex-start; gap:8px;">
      <button type="button" class="btn btn-ghost" id="btnAddTextRow">＋ 新增文字行</button>
      <button type="button" class="btn btn-primary" id="btnCopyShareCompose">複製全部內容</button>
    </div>

    <h4 class="template-section-title">常用文字（點選加到最下方）</h4>
    <div id="quickPhraseList" class="quick-phrase-list"></div>

    <div class="template-group-add" style="margin-top:12px;">
      <input type="text" id="newQuickPhraseInput" placeholder="輸入新的常用文字">
      <button type="button" class="btn btn-ghost" id="btnAddQuickPhrase">＋ 新增常用文字</button>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" id="btnCloseShareCompose">關閉</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="main.js"></script>
</body>
</html>
